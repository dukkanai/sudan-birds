name: Native compile checks

on:
  workflow_dispatch:
  push:
    branches: ['build/**']
    paths:
      - 'app/**'
      - '.github/workflows/native-checks.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/native-checks.yml'

permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: 'true'
  BOT: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'

jobs:
  android-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - run: cd app && flutter pub get --enforce-lockfile
      - run: cd app && flutter build apk --debug

  ios-simulator:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - run: cd app && flutter pub get --enforce-lockfile
      - run: cd app && flutter build ios --simulator --debug --no-codesign
