project_id = "sudan-birds-local"
[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 100
[db]
major_version = 17
[functions.media]
verify_jwt = true
[functions.contact]
verify_jwt = true
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[functions.account-delete]
verify_jwt = true
[functions.lifecycle]
verify_jwt = true
[functions.codec-diagnostic]
verify_jwt = true
[functions.media-read]
# Public verified images; handler validates any supplied user JWT independently.
verify_jwt = false
